# MOFS module + VFS registration
CONFIG_MOFS=y
CONFIG_MOFS_FS=y
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_MAX_FILE_NAME=28

# RAM disk backend for disk_access ("RAM")
CONFIG_DISK_ACCESS=y
CONFIG_DISK_DRIVER_RAM=y

# Heap for format / buffer cache / sector RMW
CONFIG_HEAP_MEM_POOL_SIZE=262144

# Logging
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3

# Interactive shell over the board UART console (qemu: west build -t run).
# Mount stays in main; use fs ls/read/write/mkdir on /MOFS.
# Zephyr's fs mount command does not know MOFS (littlefs/FAT/rpmsgfs only).
CONFIG_SHELL=y
CONFIG_FILE_SYSTEM_SHELL=y
CONFIG_SHELL_STACK_SIZE=4096

# Stack size for main thread
# NOTE: 
# A PREFETCH ABORT may occur with the default stack size.
# This value was set solely because it does not cause problems in the current implementation, as a temporary measure to mitigate the issue.
# To address the root cause, it is necessary to determine the required stack size and reduce it through refactoring.
CONFIG_MAIN_STACK_SIZE=4096

# qemu_cortex_r5 does not compile with CONFIG_MPU_STACK_GUARD
# (cortex_a_r thread.c expects thread->arch.mode, which this arch omits).
